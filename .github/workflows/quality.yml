name: PUI89 Motorcycle Quality and Shared Core Contract Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: motorcycle-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  basic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Motorcycle project
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check required project files
        run: |
          test -s README.md
          test -s SECURITY.md
          test -s docs/PROJECT_PLAN.md
          test -s docs/SAFETY_CASE.md
          test -s docs/simulation/MOTORCYCLE_RISK_SCENARIOS.json
          test -s src/pui89_motorcycle/risk_baseline.py
          test -s tests/test_motorcycle_risk_scenarios.py
      - name: Validate scenario JSON
        run: python -m json.tool docs/simulation/MOTORCYCLE_RISK_SCENARIOS.json > /dev/null
      - name: Run dependency-free regression and contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Check whitespace errors
        run: git diff --check
